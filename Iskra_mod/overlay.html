<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Искра — мысли</title>
<!--
  🎬 Оверлей мыслей «Искры» (2026-11-22). Отдаёт сервер мышления: http://127.0.0.1:8000/thoughts
  • В OBS: «Источник → Браузер», URL выше, ширина 1920 × высота 1080 — фон прозрачный, ложится поверх игры.
    ?bg=1 — тёмный фон (смотреть в обычном окне), ?n=5 — сколько последних мыслей в ленте.
  • Каждый сим — своя карточка: имя, эмоция, мысль, что делает. Цвет сима — по его имени, всегда один.
  • Страница сама опрашивает /thoughts.json раз в секунду.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #fff; --muted: rgba(255,255,255,.72); --card: rgba(14,16,24,.72); }
  html, body { margin: 0; background: transparent; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); }
  body.bg { background: #10121a; }
  #wrap { position: fixed; left: 28px; bottom: 28px; right: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .card { max-width: min(760px, 92vw); background: var(--card); border-left: 6px solid var(--c); border-radius: 14px;
          padding: 12px 18px 13px; box-shadow: 0 6px 24px rgba(0,0,0,.35); backdrop-filter: blur(4px);
          animation: in .35s ease-out; transition: opacity .6s; }
  .card.old { opacity: .55; transform: scale(.96); transform-origin: left bottom; }
  .head { display: flex; gap: 10px; align-items: baseline; font-size: 15px; color: var(--muted); }
  .name { font-weight: 800; color: var(--c); font-size: 17px; }
  .text { font-size: 24px; line-height: 1.3; font-weight: 600; margin-top: 3px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .doing { font-size: 14px; color: var(--muted); margin-top: 4px; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('bg')) document.body.classList.add('bg');
  const KEEP = Math.max(1, Math.min(12, Number(q.get('n')) || 4));
  const hue = (s) => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) % 360; return h; };
  const esc = (s) => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let last = '';
  async function tick() {
    try {
      const r = await fetch('/thoughts.json?n=' + KEEP, { cache: 'no-store' });
      const items = await r.json();
      const sig = items.map(x => x.id).join(',');
      if (sig === last) return;
      last = sig;
      document.getElementById('wrap').innerHTML = items.map((x, i) =>
        '<div class="card' + (i < items.length - 1 ? ' old' : '') + '" style="--c:hsl(' + hue(x.sim) + ' 85% 66%)">' +
          '<div class="head"><span class="name">' + esc(x.sim) + '</span>' + (x.emotion ? '<span>· ' + esc(x.emotion) + '</span>' : '') + '</div>' +
          '<div class="text">' + esc(x.thought) + '</div>' +
          (x.doing ? '<div class="doing">' + esc(x.doing) + '</div>' : '') +
        '</div>').join('');
    } catch (e) { /* сервер перезапускается — следующий опрос */ }
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
